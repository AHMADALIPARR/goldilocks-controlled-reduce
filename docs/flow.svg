<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 200" width="900" height="200">
  <rect width="900" height="200" fill="#0c0d0f"/>
  <text x="450" y="25" fill="#eceae4" font-family="sans-serif" font-size="16" text-anchor="middle">Goldilocks Controlled Reduce — Execution Flow</text>
  <rect x="20" y="50" width="130" height="70" rx="6" fill="none" stroke="#9aabba" stroke-width="1.5"/>
  <text x="85" y="80" fill="#eceae4" font-size="11" text-anchor="middle">1. Load</text>
  <text x="85" y="95" fill="#9aabba" font-size="9" text-anchor="middle">ctrl → a0</text>
  <rect x="170" y="50" width="130" height="70" rx="6" fill="none" stroke="#9aabba" stroke-width="1.5"/>
  <text x="235" y="80" fill="#eceae4" font-size="11" text-anchor="middle">2. Forward</text>
  <text x="235" y="95" fill="#9aabba" font-size="9" text-anchor="middle">Lower 32 (+1)</text>
  <rect x="320" y="50" width="130" height="70" rx="6" fill="none" stroke="#9aabba" stroke-width="1.5"/>
  <text x="385" y="80" fill="#eceae4" font-size="11" text-anchor="middle">3. Forward</text>
  <text x="385" y="95" fill="#9aabba" font-size="9" text-anchor="middle">Upper 32</text>
  <rect x="470" y="50" width="130" height="70" rx="6" fill="none" stroke="#9aabba" stroke-width="1.5"/>
  <text x="535" y="80" fill="#eceae4" font-size="11" text-anchor="middle">4. Reverse</text>
  <text x="535" y="95" fill="#9aabba" font-size="9" text-anchor="middle">Upper 32</text>
  <rect x="620" y="50" width="130" height="70" rx="6" fill="none" stroke="#9aabba" stroke-width="1.5"/>
  <text x="685" y="80" fill="#eceae4" font-size="11" text-anchor="middle">5. Reverse</text>
  <text x="685" y="95" fill="#9aabba" font-size="9" text-anchor="middle">Lower 32</text>
  <rect x="770" y="50" width="110" height="70" rx="6" fill="none" stroke="#9aabba" stroke-width="1.5"/>
  <text x="825" y="80" fill="#eceae4" font-size="11" text-anchor="middle">6. Unload</text>
  <text x="825" y="95" fill="#9aabba" font-size="9" text-anchor="middle">a0 → 0</text>
  <path d="M150 85 L170 85" stroke="#9aabba" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M300 85 L320 85" stroke="#9aabba" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M450 85 L470 85" stroke="#9aabba" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M600 85 L620 85" stroke="#9aabba" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M750 85 L770 85" stroke="#9aabba" stroke-width="1.5" marker-end="url(#arrow)"/>
  <defs>
    <marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#9aabba"/>
    </marker>
  </defs>
  <text x="450" y="150" fill="#9aabba" font-size="11" text-anchor="middle">Ping-pong: even bits write a1, odd bits write a0. Reverse restores ancillae to |0⟩.</text>
  <text x="450" y="170" fill="#9aabba" font-size="11" text-anchor="middle">Result: |x⟩|c⟩ → |x + c·(2³²−1) mod 2⁶⁴⟩|c⟩ • AGPL-3.0</text>
</svg>
